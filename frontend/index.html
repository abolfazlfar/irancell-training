<!DOCTYPE html>
<html>

<body>

<h1>My First Application</h1>

<button onclick="getMessage()">
    Get Message
</button>

<p id="message"></p>

<script>

function getMessage() {

    fetch("http://localhost:8000/message")
        .then(response => response.json())
        .then(data => {
            document.getElementById("message").innerText =
                data.message;
        });

}

</script>

</body>

</html>
